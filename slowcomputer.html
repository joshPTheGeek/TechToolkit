<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Diagnostic & Repair Checklist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            500: '#14b8a6',
                            600: '#0d9488',
                            900: '#134e4a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }
        
        .task-checkbox:checked + div {
            background-color: #0d9488;
            border-color: #0d9488;
        }
        .task-checkbox:checked + div svg {
            display: block;
        }
        
        .note-container {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.3s ease-out;
        }
        .note-container.open {
            grid-template-rows: 1fr;
        }
        .note-inner {
            overflow: hidden;
        }

        textarea {
            resize: none;
            overflow: hidden;
            min-height: 3rem;
            font-family: monospace;
        }

        code {
            background-color: #f1f5f9;
            padding: 0.125rem 0.375rem;
            border-radius: 0.25rem;
            font-size: 0.875em;
            color: #334155;
            border: 1px solid #e2e8f0;
        }

        @media print {
            @page { margin: 1.5cm; }
            body {
                background-color: white;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .no-print {
                display: none !important;
            }
            .print-break-inside-avoid {
                break-inside: avoid;
            }
            .shadow-sm, .shadow-md, .shadow-lg {
                box-shadow: none !important;
                border: 1px solid #e2e8f0;
            }
            textarea {
                border: none !important;
                padding: 0 !important;
                background: transparent !important;
                color: #475569 !important;
            }
            .note-container:not(.has-text) {
                display: none !important;
            }
            code {
                border: none;
                background: transparent;
                font-weight: 600;
            }
        }
    </style>
</head>
<body class="antialiased pb-24">

    <!-- Header Section -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-10 print:static print:border-none print:mb-6">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-4 sm:py-6">
            
            <!-- Back to Hub Link -->
            <div class="mb-4 no-print">
                <a href="index.html" class="inline-flex items-center text-sm font-medium text-slate-500 hover:text-brand-600 transition-colors">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Back to Hub
                </a>
            </div>

            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div>
                    <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight">Diagnostic Report</h1>
                    <p class="text-sm text-slate-500 mt-1">System Optimization & Repair Checklist</p>
                </div>
                <div class="flex gap-3 w-full sm:w-auto no-print">
                    <button onclick="clearData()" class="px-4 py-2 text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors w-full sm:w-auto text-center">
                        Reset Data
                    </button>
                    <button onclick="window.print()" class="px-4 py-2 text-sm font-medium text-white bg-brand-600 hover:bg-brand-700 rounded-lg shadow-sm transition-colors flex items-center justify-center gap-2 w-full sm:w-auto">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                        Print Report
                    </button>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="mt-6 no-print">
                <div class="flex justify-between text-xs font-semibold text-slate-500 mb-2">
                    <span>Progress</span>
                    <span id="progress-text">0%</span>
                </div>
                <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
                    <div id="progress-bar" class="bg-brand-500 h-2.5 rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Client / PC Info -->
        <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 sm:p-6 mb-8 print-break-inside-avoid">
            <h2 class="text-lg font-semibold text-slate-900 mb-4 border-b border-slate-100 pb-2">System Information</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-500 uppercase tracking-wider mb-1">Device / Owner</label>
                    <input type="text" id="info-device" placeholder="e.g. John's HP Envy" class="w-full border-b border-slate-300 focus:border-brand-500 bg-transparent text-slate-800 text-sm py-1 outline-none transition-colors" oninput="saveData()">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 uppercase tracking-wider mb-1">OS Version</label>
                    <input type="text" id="info-os" placeholder="e.g. Windows 11 Home" class="w-full border-b border-slate-300 focus:border-brand-500 bg-transparent text-slate-800 text-sm py-1 outline-none transition-colors" oninput="saveData()">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 uppercase tracking-wider mb-1">Date</label>
                    <input type="date" id="info-date" class="w-full border-b border-slate-300 focus:border-brand-500 bg-transparent text-slate-800 text-sm py-1 outline-none transition-colors" oninput="saveData()">
                </div>
            </div>
        </section>

        <!-- Dynamic Checklist Container -->
        <div id="checklist-container" class="space-y-8">
            <!-- Rendered via JS -->
        </div>
    </main>

    <script>
        // Diagnostic Checklist Data Structure
        const checklistData = [
            {
                category: "1. Core System & OS",
                tasks: [
                    { id: "sys-reboot", title: "Perform a Full Reboot", desc: "Ensure 'Fast Startup' isn't faking a shutdown. Actual uptime should reset." },
                    { id: "sys-sfc", title: "SFC /scannow", desc: "System File Checker to verify and repair core Windows files." },
                    { id: "sys-dism", title: "DISM RestoreHealth", desc: "Deployment Image Servicing and Management to fix component store corruption." },
                    { id: "sys-update", title: "Windows Updates", desc: "Check for and install the latest OS patches and cumulative updates." }
                ]
            },
            {
                category: "2. Storage & File System",
                tasks: [
                    { id: "store-type", title: "Verify Drive Type (SSD vs HDD)", desc: "Check Task Manager. If OS is on an HDD, recommend SSD upgrade." },
                    { id: "store-cap", title: "Check Storage Capacity", desc: "Ensure C: drive has at least 15-20% free space for virtual memory and updates." },
                    { id: "store-clean", title: "Run Disk Cleanup", desc: "Clear temporary files, old Windows update caches, and recycle bin." },
                    { id: "chk-scan", title: "Run chkdsk /scan", desc: "Runs an online scan on an NTFS volume. It finds logical errors and attempts to fix them <strong>without requiring a reboot</strong> and without locking the drive. Fast and safe first step." },
                    { id: "chk-f", title: "Run chkdsk /f", desc: "Fixes logical file system errors on the disk. It requires the drive to be locked. If scanning the C: drive, you will be prompted to schedule the scan for the <strong>next reboot</strong>." },
                    { id: "chk-r", title: "Run chkdsk /r", desc: "Locates physical bad sectors on the disk and attempts to recover readable data. It automatically includes the functionality of <code>/f</code>. <strong>Takes significantly longer (hours)</strong> and requires a reboot." }
                ]
            },
            {
                category: "3. Hardware & Performance",
                tasks: [
                    { id: "hw-ram", title: "Verify Memory (RAM) Usage", desc: "Check if 8GB is maxing out. Look at 'Committed' memory in Task Manager." },
                    { id: "hw-temp", title: "Check Thermal Throttling", desc: "Use HWMonitor/Core Temp. Ensure CPU isn't overheating and downclocking." },
                    { id: "hw-event", title: "Check Event Viewer", desc: "Look in System Logs for 'disk' warnings or 'WHEA-Logger' hardware faults." }
                ]
            },
            {
                category: "4. Software & Security",
                tasks: [
                    { id: "sec-malware", title: "Anti-Malware Scan", desc: "Run Malwarebytes or Windows Defender full scan." },
                    { id: "sec-startup", title: "Disable Startup Apps", desc: "Turn off unnecessary apps (like Discord, Spotify) in Task Manager Startup tab." },
                    { id: "sec-bloat", title: "Remove Bloatware", desc: "Uninstall unused pre-packaged software and unnecessary toolbars." },
                    { id: "sec-hp", title: "HP Support Assistant / Firmware", desc: "Check OEM tool for BIOS updates or specific driver updates." }
                ]
            }
        ];

        let appState = {
            info: { device: '', os: '', date: '' },
            tasks: {} 
        };

        const STORAGE_KEY = 'pc_diagnostic_state';

        function init() {
            loadData();
            renderChecklist();
            populateInfo();
            updateProgress();
            
            if (!appState.info.date) {
                document.getElementById('info-date').valueAsDate = new Date();
                saveData();
            }
        }

        function renderChecklist() {
            const container = document.getElementById('checklist-container');
            container.innerHTML = '';

            checklistData.forEach(section => {
                const sectionEl = document.createElement('section');
                sectionEl.className = 'print-break-inside-avoid';
                
                let tasksHtml = section.tasks.map(task => {
                    const state = appState.tasks[task.id] || { checked: false, noteEnabled: false, noteText: '' };
                    const hasNoteText = state.noteText.trim().length > 0;
                    
                    return `
                        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 sm:p-5 transition-all hover:shadow-md group">
                            <div class="flex items-start gap-4">
                                <div class="relative flex-shrink-0 mt-1">
                                    <input type="checkbox" id="${task.id}" class="task-checkbox absolute opacity-0 w-6 h-6 cursor-pointer z-10" 
                                           onchange="toggleTask('${task.id}')" ${state.checked ? 'checked' : ''}>
                                    <div class="w-6 h-6 border-2 border-slate-300 rounded transition-colors flex items-center justify-center bg-white">
                                        <svg class="w-4 h-4 text-white hidden pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
                                        </svg>
                                    </div>
                                </div>
                                
                                <div class="flex-1 min-w-0">
                                    <div class="flex flex-col sm:flex-row sm:justify-between sm:items-start gap-2">
                                        <div>
                                            <label for="${task.id}" class="text-base font-semibold text-slate-900 cursor-pointer select-none ${state.checked ? 'line-through text-slate-500' : ''}" id="label-${task.id}">
                                                ${task.title}
                                            </label>
                                            <p class="text-sm text-slate-500 mt-1 leading-snug">${task.desc}</p>
                                        </div>
                                        
                                        <label class="no-print flex items-center gap-1.5 text-xs font-medium text-slate-500 hover:text-brand-600 cursor-pointer select-none bg-slate-50 px-2.5 py-1.5 rounded-md border border-slate-100 transition-colors">
                                            <input type="checkbox" class="accent-brand-500 w-3.5 h-3.5 cursor-pointer" 
                                                   onchange="toggleNote('${task.id}', this.checked)" ${state.noteEnabled ? 'checked' : ''}>
                                            Enable Note
                                        </label>
                                    </div>

                                    <div id="note-container-${task.id}" class="note-container mt-3 ${state.noteEnabled ? 'open' : ''} ${hasNoteText ? 'has-text' : ''}">
                                        <div class="note-inner">
                                            <textarea id="note-${task.id}" 
                                                placeholder="Add your diagnostic notes, findings, or warnings here..."
                                                class="w-full text-sm text-slate-700 bg-slate-50 border border-slate-200 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-shadow placeholder-slate-400"
                                                oninput="autoResize(this); updateNoteText('${task.id}', this.value)"
                                            >${state.noteText}</textarea>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                sectionEl.innerHTML = `
                    <h3 class="text-sm font-bold text-brand-600 uppercase tracking-wider mb-3 ml-1">${section.category}</h3>
                    <div class="space-y-3">
                        ${tasksHtml}
                    </div>
                `;
                container.appendChild(sectionEl);
            });

            document.querySelectorAll('textarea').forEach(autoResize);
        }

        function toggleTask(taskId) {
            if (!appState.tasks[taskId]) appState.tasks[taskId] = {};
            const isChecked = document.getElementById(taskId).checked;
            appState.tasks[taskId].checked = isChecked;
            
            const label = document.getElementById(`label-${taskId}`);
            if (isChecked) {
                label.classList.add('line-through', 'text-slate-500');
            } else {
                label.classList.remove('line-through', 'text-slate-500');
            }

            saveData();
            updateProgress();
        }

        function toggleNote(taskId, isEnabled) {
            if (!appState.tasks[taskId]) appState.tasks[taskId] = {};
            appState.tasks[taskId].noteEnabled = isEnabled;
            
            const container = document.getElementById(`note-container-${taskId}`);
            if (isEnabled) {
                container.classList.add('open');
                setTimeout(() => document.getElementById(`note-${taskId}`).focus(), 100);
            } else {
                container.classList.remove('open');
            }
            saveData();
        }

        function updateNoteText(taskId, text) {
            if (!appState.tasks[taskId]) appState.tasks[taskId] = {};
            appState.tasks[taskId].noteText = text;
            
            const container = document.getElementById(`note-container-${taskId}`);
            if (text.trim().length > 0) {
                container.classList.add('has-text');
            } else {
                container.classList.remove('has-text');
            }
            saveData();
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        function updateProgress() {
            let total = 0;
            let checked = 0;
            
            checklistData.forEach(section => {
                section.tasks.forEach(task => {
                    total++;
                    if (appState.tasks[task.id] && appState.tasks[task.id].checked) {
                        checked++;
                    }
                });
            });

            const percent = total === 0 ? 0 : Math.round((checked / total) * 100);
            document.getElementById('progress-bar').style.width = `${percent}%`;
            document.getElementById('progress-text').innerText = `${percent}% Completed`;
        }

        function loadData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    appState = JSON.parse(saved);
                } catch (e) {
                    console.error('Error loading state', e);
                }
            }
        }

        function populateInfo() {
            document.getElementById('info-device').value = appState.info.device || '';
            document.getElementById('info-os').value = appState.info.os || '';
            document.getElementById('info-date').value = appState.info.date || '';
        }

        function saveData() {
            appState.info.device = document.getElementById('info-device').value;
            appState.info.os = document.getElementById('info-os').value;
            appState.info.date = document.getElementById('info-date').value;
            
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
        }

        function clearData() {
            if(confirm("Are you sure you want to reset the checklist and delete all notes? This cannot be undone.")) {
                localStorage.removeItem(STORAGE_KEY);
                appState = { info: { device: '', os: '', date: '' }, tasks: {} };
                init();
            }
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
